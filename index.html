
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">

  <title>Gym QR Attendance Scanner</title>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: #f3f5f9;
      font-family: Arial, sans-serif;
      color: #172033;
    }

    header {
      background: #152238;
      color: white;
      text-align: center;
      padding: 24px;
      font-size: 22px;
      font-weight: bold;
    }

    main {
      max-width: 520px;
      margin: 25px auto;
      padding: 15px;
    }

    .card {
      background: white;
      border-radius: 14px;
      padding: 22px;
      box-shadow: 0 2px 10px #00000012;
    }

    #reader {
      width: 100%;
      margin: 20px auto;
    }

    button, a.action {
      display: block;
      width: 100%;
      padding: 15px;
      margin-top: 12px;
      background: #1765c1;
      color: white;
      border: none;
      border-radius: 9px;
      font-size: 16px;
      text-align: center;
      text-decoration: none;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.5;
    }

    #status {
      padding: 15px;
      margin-top: 18px;
      border-radius: 8px;
      background: #e2e8f0;
      overflow-wrap: anywhere;
    }

    #token {
      width: 100%;
      padding: 12px;
      margin-top: 12px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
    }

    #result {
      display: none;
      margin-top: 20px;
    }
  </style>
</head>

<body>

<header>GYM QR ATTENDANCE</header>

<main>
  <div class="card">
    <h2>Reception Scanner</h2>
    <p>Scan a member's QR card.</p>

    <div id="reader"></div>

    <button onclick="startScanner()">
      Start Camera
    </button>

    <button onclick="stopScanner()">
      Stop Camera
    </button>

    <div id="status">Ready to scan</div>

    <div id="result">
      <h3>QR Code Detected</h3>

      <input id="token" readonly>

      <button onclick="copyToken()">
        Copy QR Token
      </button>

      <a class="action" id="dashboard"
         target="_blank" rel="noopener">
        Open Gym Dashboard
      </a>

      <button onclick="scanNext()">
        Scan Next Member
      </button>
    </div>
  </div>
</main>

<script>
  // Replace this with your own Apps Script web app URL.
  const GYM_DASHBOARD_URL =
    "https://script.google.com/a/macros/cukerala.ac.in/s/AKfycbwBg7mt7_On-PHwqKzwPLA21YJRGE_er9Iqj5rpaRnuOgZH2URt-pVpc-E73XdToJf-/exec";

  document.getElementById("dashboard").href =
    GYM_DASHBOARD_URL;

  let scanner = null;
  let running = false;
  let detected = false;

  function statusMessage(message, success = true) {
    const el = document.getElementById("status");
    el.textContent = message;
    el.style.background =
      success ? "#dcfce7" : "#fee2e2";
  }

  async function startScanner() {
    if (running) return;

    try {
      if (typeof Html5Qrcode === "undefined") {
        throw new Error("Scanner library unavailable");
      }

      scanner = new Html5Qrcode("reader");

      const cameras = await Html5Qrcode.getCameras();

      if (!cameras.length) {
        throw new Error("No camera detected");
      }

      const rear = cameras.find(c =>
        /back|rear|environment/i.test(c.label)
      );

      const camera = rear || cameras[0];

      await scanner.start(
        camera.id,
        {
          fps: 10,
          qrbox: { width: 220, height: 220 }
        },
        function(decodedText) {
          if (detected) return;

          detected = true;

          document.getElementById("token").value =
            decodedText.trim();

          document.getElementById("result")
            .style.display = "block";

          statusMessage("QR code detected successfully");

          stopScanner();
        },
        function() {}
      );

      running = true;
      statusMessage("Camera ready");

    } catch (error) {
      running = false;
      statusMessage(
        "Camera error: " +
        (error.message || String(error)),
        false
      );
    }
  }

  async function stopScanner() {
    if (!scanner) return;

    try {
      if (running) await scanner.stop();
      scanner.clear();
    } catch (e) {
      console.error(e);
    }

    running = false;
    scanner = null;
  }

  async function copyToken() {
    const input = document.getElementById("token");

    try {
      await navigator.clipboard.writeText(input.value);
      statusMessage("Token copied. Open gym dashboard.");
    } catch (e) {
      input.focus();
      input.select();
      statusMessage("Select and copy the token manually.");
    }
  }

  async function scanNext() {
    await stopScanner();

    detected = false;
    document.getElementById("result")
      .style.display = "none";

    document.getElementById("token").value = "";

    await startScanner();
  }
</script>

</body>
</html>
